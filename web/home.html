<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuração de Rede</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 24px;
  }

  .container {
    background: #ffffff;
    border-radius: 22px;
    padding: 36px 32px 32px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .mascot {
    text-align: center;
    margin: -8px 0 12px;
  }

  .mascot svg {
    width: 240px;
    height: auto;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.18));
  }

  h1 {
    text-align: center;
    color: #2b2b2b;
    font-size: 1.35rem;
    margin-bottom: 24px;
    letter-spacing: -0.3px;
  }

  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  select,
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e4e6ec;
    border-radius: 11px;
    font-size: 1rem;
    color: #333;
    background: #fafbff;
    transition: border-color .2s, box-shadow .2s, background .2s;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }

  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23667eea' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 38px;
  }

  select:focus,
  input:focus {
    outline: none;
    border-color: #667eea;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.16);
  }

  ::placeholder { color: #b3b8c4; }

  button[type="submit"] {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: none;
    border-radius: 11px;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.4px;
    cursor: pointer;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    transition: transform .15s ease, box-shadow .25s ease, filter .2s;
    box-shadow: 0 6px 18px rgba(102, 126, 234, 0.35);
  }

  button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(102, 126, 234, 0.45);
    filter: brightness(1.05);
  }

  button[type="submit"]:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
  }

  @media (max-width: 420px) {
    .container { padding: 28px 20px 24px; }
    .mascot svg { width: 200px; }
    h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>

  <div class="container">

    <!-- Pica-Pau com balão "E aí, meu chapa!" -->
    <div class="mascot">
      <img style="width:80px;height:80px" src="/chapa.png">
    </div>

    <h1>E aí, meu chapa!</h1>

    <form action="/configure" method="post">
      <div class="field">
        <label for="mode">Modo</label>
        <select id="mode" name="mode" required>
          <option value="accesspoint">Access point</option>
          <option value="network">NetWork</option>
        </select>
      </div>

      <div class="field">
        <label for="ssid">SSID</label>
        <input type="text" id="ssid" name="ssid"
               placeholder="Nome da rede" required autocomplete="off">
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password"
               placeholder="Digite a senha" required autocomplete="new-password">
      </div>

      <button type="submit">Enviar</button>
    </form>

  </div>

</body>
</html>
